<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Касса</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --bg: #121214; --card: #1c1c1f; --accent: #ff6b00; --text: #ffffff; --subtext: #8e8e93; }
    body { margin: 0; padding: 16px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); user-select: none; padding-bottom: 90px; }
    h2 { margin: 0 0 16px 0; font-size: 20px; font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .item-card { background: var(--card); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; justify-content: space-between; border: 1px solid rgba(255, 255, 255, 0.05); cursor: pointer; transition: transform 0.1s, border-color 0.2s; }
    .item-card:active { transform: scale(0.97); }
    .item-card.active { border-color: var(--accent); }
    .item-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .item-price { color: var(--accent); font-size: 14px; font-weight: 700; }
    .counter { margin-top: 10px; display: flex; align-items: center; justify-content: space-between; background: rgba(255, 255, 255, 0.07); border-radius: 8px; padding: 4px 8px; }
    .btn-count { background: none; border: none; color: var(--text); font-size: 18px; font-weight: 700; padding: 2px 8px; cursor: pointer; }
    .count-val { font-size: 14px; font-weight: 600; }
    .pay-methods { display: flex; gap: 10px; margin-top: 20px; }
    .pay-btn { flex: 1; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); background: var(--card); color: var(--text); font-size: 14px; font-weight: 600; cursor: pointer; text-align: center; }
    .pay-btn.selected { background: var(--accent); border-color: var(--accent); }
    .bottom-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #1c1c1f; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255, 255, 255, 0.1); }
    .total-info { display: flex; flex-direction: column; }
    .total-label { font-size: 12px; color: var(--subtext); }
    .total-sum { font-size: 20px; font-weight: 700; color: var(--accent); }
    .btn-submit { background: var(--accent); color: #fff; border: none; padding: 12px 24px; border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; }
    .btn-submit:disabled { opacity: 0.4; cursor: not-allowed; }
    .loader { text-align: center; color: var(--subtext); margin-top: 40px; font-size: 14px; }
  </style>
</head>
<body>

  <h2>☕️ Меню кассы</h2>

  <!-- Сюда будут грузиться товары -->
  <div class="grid" id="itemsGrid">
    <div class="loader">Загрузка меню...</div>
  </div>

  <h3 style="margin-top: 24px; font-size: 16px;">Тип оплаты:</h3>
  <div class="pay-methods">
    <div class="pay-btn selected" id="payCash" onclick="setPayment('Наличные')">💵 Наличные</div>
    <div class="pay-btn" id="payCard" onclick="setPayment('Карта')">💳 Карта</div>
  </div>

  <div class="bottom-bar">
    <div class="total-info">
      <span class="total-label">Итого к оплате:</span>
      <span class="total-sum" id="totalSum">0 ₴</span>
    </div>
    <button class="btn-submit" id="submitBtn" onclick="submitOrder()" disabled>Оплатить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand(); 

    // ВСТАВЬ СЮДА СВОЮ ССЫЛКУ НА APPS SCRIPT (та, что заканчивается на /exec)
    const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxoxOl1uem2NUGdPiQ6eCNXCkTSFaAFZc5xHqhWG398EmZPBr06V1o_sZUWx-aOzYchYw/exec';

    let MENU = [];
    let cart = {};
    let paymentMethod = "Наличные";

    // Подтягиваем меню из Гугл Таблицы
    async function fetchMenu() {
      try {
        const response = await fetch(GOOGLE_SCRIPT_URL);
        MENU = await response.json();
        renderMenu();
      } catch (error) {
        document.getElementById('itemsGrid').innerHTML = '<div class="loader">Ошибка загрузки. Проверьте ссылку.</div>';
      }
    }

    function renderMenu() {
      const grid = document.getElementById('itemsGrid');
      grid.innerHTML = '';
      MENU.forEach(item => {
        const count = cart[item.name] || 0;
        grid.innerHTML += `
          <div class="item-card ${count > 0 ? 'active' : ''}">
            <div>
              <div class="item-title">${item.name}</div>
              <div class="item-price">${item.price} ₴</div>
            </div>
            <div class="counter">
              <button class="btn-count" onclick="changeCount('${item.name}', -1)">-</button>
              <span class="count-val">${count}</span>
              <button class="btn-count" onclick="changeCount('${item.name}', 1)">+</button>
            </div>
          </div>
        `;
      });
      updateTotal();
    }

    function changeCount(name, delta) {
      if (!cart[name]) cart[name] = 0;
      cart[name] += delta;
      if (cart[name] <= 0) delete cart[name];
      renderMenu();
    }

    function setPayment(method) {
      paymentMethod = method;
      document.getElementById('payCash').classList.toggle('selected', method === 'Наличные');
      document.getElementById('payCard').classList.toggle('selected', method === 'Карта');
    }

    function updateTotal() {
      let total = 0;
      let count = 0;
      for (let name in cart) {
        const item = MENU.find(m => m.name === name);
        total += item.price * cart[name];
        count += cart[name];
      }
      document.getElementById('totalSum').innerText = `${total} ₴`;
      document.getElementById('submitBtn').disabled = count === 0;
    }

    function submitOrder() {
      const order = [];
      let total = 0;
      for (let name in cart) {
        const item = MENU.find(m => m.name === name);
        order.push({ name: name, count: cart[name], price: item.price });
        total += item.price * cart[name];
      }
      const payload = { type: "order", items: order, payment: paymentMethod, total: total };
      tg.sendData(JSON.stringify(payload));
    }

    // Запускаем загрузку при открытии
    fetchMenu();
  </script>
</body>
</html>
